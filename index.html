<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Memories Vault & Gallery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-2xl fa-heart text-rose-500 animate-pulse"></i>
                <span class="font-serif-custom text-xl sm:text-2xl font-bold bg-gradient-to-r from-rose-400 to-pink-500 bg-clip-text text-transparent">
                    Memories Vault
                </span>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openUploadModal()" class="px-4 py-1.5 text-xs sm:text-sm bg-rose-600 hover:bg-rose-500 text-white rounded-lg shadow-lg shadow-rose-600/30 font-medium transition-all duration-200 flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Upload</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <!-- Title Banner -->
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-5xl font-extrabold font-serif-custom tracking-tight text-slate-100 mb-3">
                Our Sweet Moments
            </h1>
            <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
                အမှတ်တရ ဓာတ်ပုံများနှင့် ဗီဒီယိုများကို တစ်နေရာတည်းတွင် လုံခြုံစွာ သိမ်းဆည်းထားသော နယ်မြေ
            </p>
        </div>

        <!-- Dynamic Grid Gallery -->
        <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Loading Spinner -->
            <div id="galleryLoader" class="col-span-full text-center py-20 text-slate-500">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-rose-500"></i>
                <p>အမှတ်တရများကို ရယူနေပါသည်...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Couple Memories Vault & Gallery. All Rights Reserved.</p>
    </footer>

    <!-- Bulk Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-slate-100 mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-cloud-arrow-up text-rose-500"></i>
                <span>အမှတ်တရဓာတ်ပုံ/ဗီဒီယို တင်ရန်</span>
            </h3>

            <form id="uploadForm" onsubmit="handleBulkUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ခေါင်းစဉ် / CAPTION</label>
                    <input type="text" id="uploadCaption" placeholder="My Eunji <3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">အမျိုးအစား</label>
                        <select id="uploadType" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500">
                            <option value="image">Photo (ပုံ)</option>
                            <option value="video">Video (ဗီဒီယို)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">ရက်စွဲ (OPTIONAL)</label>
                        <input type="date" id="uploadDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">PASSWORD (ADMIN)</label>
                    <input type="password" id="adminPassword" placeholder="****" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ဖိုင်များ ရွေးချယ်ရန် (အများကြီး ရွေးလို့ရပါသည်)</label>
                    <input type="file" id="uploadFiles" multiple accept="image/*,video/*" required class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-600 file:text-white hover:file:bg-rose-500 cursor-pointer">
                </div>

                <!-- Progress Bar Area -->
                <div id="progressContainer" class="hidden space-y-1">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span id="progressText">Uploading...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div id="progressBar" class="bg-rose-500 h-2 w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <button type="submit" id="submitUploadBtn" class="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-medium text-sm transition-all duration-200">
                    Upload တင်မည်
                </button>
            </form>
        </div>
    </div>

    <!-- Lightbox Media Viewer Modal -->
    <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center hidden select-none">
        <!-- Close Button -->
        <button onclick="closeLightbox()" class="absolute top-5 right-5 text-slate-400 hover:text-white z-50 text-2xl">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Previous Button -->
        <button onclick="navigateLightbox(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-slate-900/60 hover:bg-slate-800 text-white p-3 rounded-full z-50 transition-all">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>

        <!-- Media Display Area -->
        <div class="max-w-4xl max-h-[85vh] p-2 flex flex-col items-center justify-center">
            <div id="lightboxMediaContainer" class="flex items-center justify-center max-h-[75vh]">
                <!-- Dynamic Image/Video Inserted Here -->
            </div>
            <div class="mt-3 text-center">
                <p id="lightboxCaption" class="text-slate-200 font-medium text-sm sm:text-base"></p>
                <p id="lightboxDate" class="text-slate-500 text-xs mt-0.5"></p>
            </div>
        </div>

        <!-- Next Button -->
        <button onclick="navigateLightbox(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-slate-900/60 hover:bg-slate-800 text-white p-3 rounded-full z-50 transition-all">
            <i class="fa-solid fa-chevron-right text-lg"></i>
        </button>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configurations
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey_For_Vault_Config",
            authDomain: "couple-vault.firebaseapp.com",
            projectId: "couple-vault",
            storageBucket: "couple-vault.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ImgBB API Key
        const IMGBB_API_KEY = "6d257f69d70150c37db99215838d826c";

        let mediaList = [];
        let currentMediaIndex = 0;

        // Modal Controls
        window.openUploadModal = () => document.getElementById('uploadModal').classList.remove('hidden');
        window.closeUploadModal = () => document.getElementById('uploadModal').classList.add('hidden');

        // Fetch & Render Gallery Data
        async function fetchGallery() {
            try {
                const q = query(collection(db, "memories"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                mediaList = [];
                querySnapshot.forEach((doc) => {
                    mediaList.push({ id: doc.id, ...doc.data() });
                });

                renderGallery();
            } catch (err) {
                console.warn("Firestore offline/fallback mode:", err);
                mediaList = [
                    { type: 'image', url: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600', caption: 'Sweet Memories', date: '2026-09-01' },
                    { type: 'image', url: 'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600', caption: 'Together Forever', date: '2026-08-15' },
                    { type: 'image', url: 'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600', caption: 'Special Day', date: '2026-07-20' }
                ];
                renderGallery();
            }
        }

        function renderGallery() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';

            if (mediaList.length === 0) {
                galleryGrid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">အမှတ်တရများ မရှိသေးပါUpload တင်ပေးပါ။</p>`;
                return;
            }

            mediaList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "group relative aspect-square bg-slate-800 rounded-xl overflow-hidden cursor-pointer shadow-md hover:shadow-rose-500/20 transition-all duration-300";
                card.onclick = () => openLightbox(index);

                if (item.type === 'video') {
                    card.innerHTML = `
                        <video src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"></video>
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                            <i class="fa-solid fa-circle-play text-3xl text-white/80 group-hover:text-rose-500 transition-colors"></i>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <img src="${item.url}" alt="${item.caption}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-3">
                            <p class="text-xs text-slate-200 font-medium truncate">${item.caption || 'Memory'}</p>
                        </div>
                    `;
                }
                galleryGrid.appendChild(card);
            });
        }

        // Bulk Upload Handler
        window.handleBulkUpload = async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('adminPassword').value;
            if (password !== "1234") {
                alert("Admin Password မှားယွင်းနေပါသည်!");
                return;
            }

            const files = document.getElementById('uploadFiles').files;
            const caption = document.getElementById('uploadCaption').value;
            const type = document.getElementById('uploadType').value;
            const date = document.getElementById('uploadDate').value || new Date().toISOString().split('T')[0];

            if (files.length === 0) return;

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const progressPercent = document.getElementById('progressPercent');
            const submitBtn = document.getElementById('submitUploadBtn');

            progressContainer.classList.remove('hidden');
            submitBtn.disabled = true;

            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                progressText.innerText = `Uploading ${i + 1}/${files.length}...`;
                
                try {
                    const formData = new FormData();
                    formData.append('image', file);

                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await res.json();
                    if (data.success) {
                        const mediaUrl = data.data.url;
                        const mediaItem = {
                            url: mediaUrl,
                            caption: caption || file.name,
                            type: type,
                            date: date,
                            timestamp: Date.now()
                        };

                        mediaList.unshift(mediaItem);
                        try {
                            await addDoc(collection(db, "memories"), mediaItem);
                        } catch (fsErr) {
                            console.warn("Firestore sync skipped:", fsErr);
                        }

                        successCount++;
                    }
                } catch (err) {
                    console.error("Upload error:", err);
                }

                const percent = Math.round(((i + 1) / files.length) * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.innerText = `${percent}%`;
            }

            alert(`${successCount} ဖိုင် တင်ပြီးပါပြီ!`);
            submitBtn.disabled = false;
            progressContainer.classList.add('hidden');
            document.getElementById('uploadForm').reset();
            closeUploadModal();
            renderGallery();
        };

        // Lightbox Operations
        window.openLightbox = (index) => {
            currentMediaIndex = index;
            updateLightboxContent();
            document.getElementById('lightboxModal').classList.remove('hidden');
        };

        window.closeLightbox = () => {
            document.getElementById('lightboxModal').classList.add('hidden');
        };

        window.navigateLightbox = (direction) => {
            currentMediaIndex += direction;
            if (currentMediaIndex < 0) currentMediaIndex = mediaList.length - 1;
            if (currentMediaIndex >= mediaList.length) currentMediaIndex = 0;
            updateLightboxContent();
        };

        function updateLightboxContent() {
            const item = mediaList[currentMediaIndex];
            const container = document.getElementById('lightboxMediaContainer');
            const caption = document.getElementById('lightboxCaption');
            const date = document.getElementById('lightboxDate');

            if (item.type === 'video') {
                container.innerHTML = `<video src="${item.url}" controls autoplay class="max-h-[75vh] max-w-full rounded-lg shadow-2xl"></video>`;
            } else {
                container.innerHTML = `<img src="${item.url}" class="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl">`;
            }

            caption.innerText = item.caption || '';
            date.innerText = item.date || '';
        }

        // Keyboard Navigation (Arrow Keys)
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightboxModal');
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        // Initialize App
        fetchGallery();
    </script>
</body>
</html>
