<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couple Memories Vault & Gallery</title>
 
  <!-- WEBSITE TAB FAVICON -->
  <link rel="icon" type="image/jpeg" href="favicon.jpg">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 500: '#f43f5e', 600: '#e11d48' } } } }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-rose-500 selection:text-white">

  <!-- ADMIN LOGIN SCREEN -->
  <div id="loginPage" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-8 shadow-2xl text-center">
      <h2 class="text-2xl font-bold bg-gradient-to-r from-rose-500 to-pink-500 bg-clip-text text-transparent mb-2">
        Couple Memories
      </h2>
      <p class="text-xs text-slate-400 mb-6">Website သို့ ဝင်ရောက်ရန် Admin Email & Password ရိုက်ထည့်ပါ</p>
     
      <form id="adminLoginForm" class="space-y-4">
        <input type="email" id="mainAdminEmail" placeholder="Admin Email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-rose-500 transition">
        <input type="password" id="mainAdminPassword" placeholder="Admin Password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-rose-500 transition">
        <button type="submit" id="loginSubmitBtn" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-rose-500/25">
          Login ဝင်မည်
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTENT -->
  <div id="mainApp" class="hidden">
    <!-- Header Section -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <h1 class="text-xl font-bold bg-gradient-to-r from-rose-500 to-pink-500 bg-clip-text text-transparent">
          Couple Memories
        </h1>
        <div class="flex items-center gap-3">
          <button id="openUploadModalBtn" class="bg-rose-500 hover:bg-rose-600 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-rose-500/20 active:scale-95">
            + အမှတ်တရသစ်တင်ရန်
          </button>
          <button id="logoutBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-3 py-2 rounded-xl text-xs transition">
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Gallery Grid Container -->
    <main class="max-w-6xl mx-auto px-4 py-8">
      <div id="mediaContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Firestore Data -->
      </div>
    </main>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6 sticky top-0 bg-slate-900 z-10 pb-2 border-b border-slate-800">
        <h3 class="text-lg font-bold text-white">အမှတ်တရဓာတ်ပုံ/ဗီဒီယို တင်ရန်</h3>
        <button id="closeUploadModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">&times;</button>
      </div>

      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ခေါင်းစဉ် / CAPTION</label>
          <input type="text" id="uploadTitle" placeholder="My Eunji <3" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">အမျိုးအစား</label>
            <select id="uploadType" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition">
              <option value="Photo">Photo (ပုံ)</option>
              <option value="Video">Video (ဗီဒီယို)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ရက်စွဲ (OPTIONAL)</label>
            <input type="date" id="uploadDate" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ဖိုင်များရွေးချယ်ရန် (ပုံ/ဗီဒီယို Select လုပ်ပါ)</label>
          <input type="file" id="uploadFile" multiple accept="image/*,video/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-rose-500 file:text-white hover:file:bg-rose-600 transition cursor-pointer">
        </div>

        <div id="uploadProgressContainer" class="hidden pt-2">
          <div class="flex justify-between text-xs text-rose-400 mb-1">
            <span id="progressText">Uploading to Cloudinary...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
            <div id="progressBar" class="bg-rose-500 h-2 rounded-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" id="submitBtn" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-rose-500/25 text-sm">
            Upload တင်မည်
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- FULLSCREEN SLIDER VIEWER MODAL -->
  <div id="viewModal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 hidden z-50 select-none">
    <button id="closeViewModalBtn" class="absolute top-5 right-5 text-white/70 hover:text-white text-3xl font-bold bg-slate-800/60 hover:bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center transition z-10">&times;</button>
   
    <button id="prevBtn" class="absolute left-4 top-1/2 -translate-y-1/2 bg-slate-800/80 hover:bg-rose-500 text-white p-3.5 rounded-full transition duration-200 z-10 focus:outline-none shadow-lg hover:scale-110">
      &#10094;
    </button>

    <button id="nextBtn" class="absolute right-4 top-1/2 -translate-y-1/2 bg-slate-800/80 hover:bg-rose-500 text-white p-3.5 rounded-full transition duration-200 z-10 focus:outline-none shadow-lg hover:scale-110">
      &#10095;
    </button>

    <div class="max-w-4xl w-full max-h-[90vh] flex flex-col items-center px-8">
      <div id="modalMediaContent" class="w-full flex justify-center items-center max-h-[75vh] overflow-hidden rounded-2xl mb-4">
      </div>
      <h3 id="modalTitle" class="text-xl font-bold text-white text-center"></h3>
      <p id="modalDate" class="text-xs text-rose-400 font-medium mt-1"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Cloudinary Configs
    const CLOUDINARY_CLOUD_NAME = "vneswxx4";
    const CLOUDINARY_UPLOAD_PRESET = "myeunji";

    // Firebase Real Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyDZyW992JYkmfB9S9JskJNNyxX0wfjooBY",
      authDomain: "sweb-24fdc.firebaseapp.com",
      projectId: "sweb-24fdc",
      storageBucket: "sweb-24fdc.firebasestorage.app",
      messagingSenderId: "883021695279",
      appId: "1:883021695279:web:e44dc36321ee3ad40539da",
      measurementId: "G-B50ELELYBG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Login Data ကို Memory ထဲမှာပဲ ခဏသိမ်းစေရန် (Browser Storage ထဲ မသိမ်းစေရန်) သတ်မှတ်ခြင်း
    setPersistence(auth, inMemoryPersistence).catch((error) => {
      console.error("Persistence Error:", error);
    });

    const loginPage = document.getElementById("loginPage");
    const mainApp = document.getElementById("mainApp");
    const adminLoginForm = document.getElementById("adminLoginForm");
    const mainAdminEmail = document.getElementById("mainAdminEmail");
    const mainAdminPassword = document.getElementById("mainAdminPassword");
    const loginSubmitBtn = document.getElementById("loginSubmitBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const openUploadModalBtn = document.getElementById("openUploadModalBtn");
    const closeUploadModalBtn = document.getElementById("closeUploadModalBtn");
    const uploadModal = document.getElementById("uploadModal");
    const uploadForm = document.getElementById("uploadForm");
    const container = document.getElementById("mediaContainer");
    const progressContainer = document.getElementById("uploadProgressContainer");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const progressPercent = document.getElementById("progressPercent");
    const submitBtn = document.getElementById("submitBtn");

    const viewModal = document.getElementById("viewModal");
    const closeViewModalBtn = document.getElementById("closeViewModalBtn");
    const modalMediaContent = document.getElementById("modalMediaContent");
    const modalTitle = document.getElementById("modalTitle");
    const modalDate = document.getElementById("modalDate");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let memoryList = [];
    let currentIndex = 0;
    let isInitialLoad = true;

    // Authentication State စစ်ဆေးခြင်း
    onAuthStateChanged(auth, async (user) => {
      // Page ဖွင့်ဖွင့်ချင်း ရှေ့က ဝင်ထားခဲ့တဲ့ Cache session ရှိနေပါက အတင်း Sign Out လုပ်ပေးမည်
      if (isInitialLoad && user) {
        isInitialLoad = false;
        await signOut(auth);
        mainApp.classList.add("hidden");
        loginPage.classList.remove("hidden");
        return;
      }
      
      isInitialLoad = false;

      if (user) {
        loginPage.classList.add("hidden");
        mainApp.classList.remove("hidden");
        loadMemories();
      } else {
        mainApp.classList.add("hidden");
        loginPage.classList.remove("hidden");
      }
    });

    adminLoginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginSubmitBtn.disabled = true;
      loginSubmitBtn.innerText = "စစ်ဆေးနေပါသည်...";

      try {
        await signInWithEmailAndPassword(auth, mainAdminEmail.value, mainAdminPassword.value);
        adminLoginForm.reset();
      } catch (error) {
        alert("Login ဝင်ရောက်မှု မအောင်မြင်ပါ! Email သို့မဟုတ် Password မှားယွင်းနေပါသည်။");
        console.error("Auth Error:", error);
      } finally {
        loginSubmitBtn.disabled = false;
        loginSubmitBtn.innerText = "Login ဝင်မည်";
      }
    });

    logoutBtn.addEventListener("click", () => {
      signOut(auth);
    });

    openUploadModalBtn.addEventListener("click", () => uploadModal.classList.remove("hidden"));
    closeUploadModalBtn.addEventListener("click", () => uploadModal.classList.add("hidden"));

    closeViewModalBtn.addEventListener("click", () => viewModal.classList.add("hidden"));
    viewModal.addEventListener("click", (e) => {
      if (e.target === viewModal) viewModal.classList.add("hidden");
    });

    prevBtn.addEventListener("click", showPrev);
    nextBtn.addEventListener("click", showNext);

    document.addEventListener("keydown", (e) => {
      if (!viewModal.classList.contains("hidden")) {
        if (e.key === "ArrowLeft") showPrev();
        if (e.key === "ArrowRight") showNext();
        if (e.key === "Escape") viewModal.classList.add("hidden");
      }
    });

    function showPrev() {
      if (memoryList.length === 0) return;
      currentIndex = (currentIndex - 1 + memoryList.length) % memoryList.length;
      updateModalDisplay();
    }

    function showNext() {
      if (memoryList.length === 0) return;
      currentIndex = (currentIndex + 1) % memoryList.length;
      updateModalDisplay();
    }

    function updateModalDisplay() {
      const item = memoryList[currentIndex];
      const imageUrl = item.url || item.display_url || item.imageUrl || '';

      if (item.type === "Video") {
        modalMediaContent.innerHTML = `<video src="${imageUrl}" controls autoplay class="max-h-[75vh] w-auto rounded-xl shadow-2xl"></video>`;
      } else {
        modalMediaContent.innerHTML = `<img src="${imageUrl}" class="max-h-[75vh] w-auto object-contain rounded-xl shadow-2xl transition duration-300">`;
      }
      modalTitle.innerText = item.title || "Untitled";
      modalDate.innerText = item.date || "Special Moment";
    }

    function loadMemories() {
      const q = query(collection(db, "couple_memories"));
      onSnapshot(q, (snapshot) => {
        memoryList = [];
        if (!snapshot.empty) {
          snapshot.forEach((docSnap) => {
            const item = docSnap.data();
            item.id = docSnap.id;
            memoryList.push(item);
          });
        }
        renderGallery();
      }, (err) => {
        console.error("Firestore read error:", err);
      });
    }

    function renderGallery() {
      container.innerHTML = "";
      if (memoryList.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">အမှတ်တရ ဓာတ်ပုံများ မရှိသေးပါ</div>`;
        return;
      }

      memoryList.forEach((item, index) => {
        const imageUrl = item.url || item.display_url || item.imageUrl || '';

        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col group hover:border-slate-700 transition duration-300";
        card.innerHTML = `
          <div class="relative overflow-hidden aspect-video bg-slate-950 flex items-center justify-center cursor-pointer media-preview-click">
            ${imageUrl ? (item.type === 'Video' ? `<video src="${imageUrl}" class="w-full h-full object-cover"></video><div class="absolute inset-0 bg-black/40 flex items-center justify-center text-3xl">▶️</div>` : `<img src="${imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">`) : `<div class="text-xs text-slate-500">ပုံ/ဗီဒီယို မရှိပါ</div>`}
            <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
               <span class="text-xs bg-black/60 text-white px-3 py-1.5 rounded-full border border-white/20">🔍 ကြည့်ရန် နှိပ်ပါ</span>
            </div>
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-rose-500/10 text-rose-400 border border-rose-500/20">${item.type || 'Photo'}</span>
                <span class="text-xs text-slate-500 font-medium">${item.date || 'Special Moment'}</span>
              </div>
              <h4 class="font-bold text-base text-white leading-snug cursor-pointer media-preview-click">${item.title || 'Untitled'}</h4>
            </div>
            <div class="pt-4 mt-4 border-t border-slate-800/80 flex justify-end">
              <button data-del-id="${item.id}" class="delete-btn text-xs font-semibold text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-3 py-1.5 rounded-lg transition">ဖျက်မည်</button>
            </div>
          </div>
        `;

        const mediaClicks = card.querySelectorAll(".media-preview-click");
        mediaClicks.forEach(el => {
          el.addEventListener("click", () => {
            currentIndex = index;
            updateModalDisplay();
            viewModal.classList.remove("hidden");
          });
        });

        container.appendChild(card);
      });

      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (confirm("ဒီအမှတ်တရလေးကို ဖျက်ပစ်ဖို့ သေချာပါသလား?")) {
            if (btn.dataset.delId) {
              await deleteDoc(doc(db, "couple_memories", btn.dataset.delId));
            }
          }
        });
      });
    }

    // Real-time Upload Progress & Error Handling ပါဝင်သော XMLHttpRequest Function
    const uploadToCloudinary = async (file) => {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const resourceType = file.type.startsWith('video/') ? 'video' : 'image';
     
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = `${percent}%`;
            progressPercent.innerText = `${percent}%`;
           
            if (percent === 100) {
              progressText.innerText = "Processing video on server... (ခဏစောင့်ပါ)";
            }
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const data = JSON.parse(xhr.responseText);
            resolve(data.secure_url);
          } else {
            const errorData = JSON.parse(xhr.responseText);
            reject(new Error(errorData.error?.message || "Upload failed"));
          }
        };

        xhr.onerror = () => reject(new Error("Network Error / Connection Lost"));
        xhr.send(formData);
      });
    };

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const files = document.getElementById("uploadFile").files;
      if (!files || files.length === 0) return alert("ဖိုင်ရွေးချယ်ပါ");

      progressContainer.classList.remove("hidden");
      submitBtn.disabled = true;

      const titleInput = document.getElementById("uploadTitle").value.trim();
      const typeInput = document.getElementById("uploadType").value;
      const dateInput = document.getElementById("uploadDate").value || "Special Moment";

      let count = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        progressText.innerText = `Uploading ${i + 1}/${files.length} (${file.name})...`;
        progressBar.style.width = `0%`;
        progressPercent.innerText = `0%`;

        try {
          const uploadedUrl = await uploadToCloudinary(file);
          const isVideo = file.type.startsWith('video/') || typeInput === 'Video';

          const memoryItem = {
            title: titleInput || file.name,
            type: isVideo ? "Video" : "Photo",
            date: dateInput,
            url: uploadedUrl,
            createdAt: Date.now()
          };

          await addDoc(collection(db, "couple_memories"), memoryItem);
          count++;
        } catch (err) {
          console.error("Upload error:", err);
          alert(`Error uploading ${file.name}: ${err.message}`);
        }
      }

      if (count > 0) {
        alert(`${count} ဖိုင် အောင်မြင်စွာ တင်ပြီးပါပြီ!`);
      }
     
      progressContainer.classList.add("hidden");
      submitBtn.disabled = false;
      uploadForm.reset();
      uploadModal.classList.add("hidden");
    });
  </script>
</body>
</html>
