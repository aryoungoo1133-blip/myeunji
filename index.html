let memories = [];

function loadMemories() {
    const memoriesRef = collection(db, "couple_memories");
    const q = query(memoriesRef);

    onSnapshot(q, (snapshot) => {
        memories = snapshot.docs.map((item) => ({
            id: item.id,
            ...item.data()
        }));
        renderGallery();
    }, (error) => {
        console.error("Error loading memories:", error);
    });
}

function renderGallery() {
    mediaContainer.innerHTML = "";

    if (memories.length === 0) {
        mediaContainer.innerHTML = `
            <div class="empty-state col-span-full rounded-3xl p-12 text-center">
                <div class="text-5xl mb-4">💗</div>
                <h3 class="text-xl font-bold text-white">No Memories Yet</h3>
                <p class="text-slate-500 mt-2">Upload your first memory to get started.</p>
            </div>
        `;
        return;
    }

    memories.forEach((memory, index) => {
        const card = document.createElement("div");
        card.className = "memory-card group cursor-pointer";

        const mediaWrapper = document.createElement("div");
        mediaWrapper.className = "relative aspect-[4/3] overflow-hidden bg-slate-900";

        let mediaElement;
        if (memory.type === "video") {
            mediaElement = document.createElement("video");
            mediaElement.controls = false;
            mediaElement.muted = true;
            mediaElement.playsInline = true;
            mediaElement.className = "memory-media w-full h-full object-cover";
            mediaElement.src = memory.url;
        } else {
            mediaElement = document.createElement("img");
            mediaElement.loading = "lazy";
            mediaElement.className = "memory-media w-full h-full object-cover";
            mediaElement.src = memory.url;
            mediaElement.alt = memory.title || "Memory";
        }

        mediaWrapper.appendChild(mediaElement);

        const overlay = document.createElement("div");
        overlay.className = "absolute inset-0 bg-gradient-to-t from-black/65 via-transparent to-transparent opacity-70";
        mediaWrapper.appendChild(overlay);
        card.appendChild(mediaWrapper);

        const content = document.createElement("div");
        content.className = "p-4";

        const title = document.createElement("h3");
        title.className = "font-bold text-white truncate";
        title.textContent = memory.title || "Untitled Memory";

        const meta = document.createElement("div");
        meta.className = "flex items-center justify-between gap-3 mt-2";

        const date = document.createElement("p");
        date.className = "text-xs text-slate-500";
        date.textContent = memory.date || "";

        const type = document.createElement("span");
        type.className = "text-[10px] uppercase tracking-wider font-bold px-2 py-1 rounded-md bg-rose-500/10 text-rose-400 border border-rose-500/10";
        type.textContent = memory.type || "image";

        meta.appendChild(date);
        meta.appendChild(type);
        content.appendChild(title);
        content.appendChild(meta);

        const deleteButton = document.createElement("button");
        deleteButton.className = "mt-4 w-full py-2 rounded-xl text-sm font-semibold bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/10 transition";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", async (event) => {
            event.stopPropagation();
            const confirmed = confirm("Are you sure you want to delete this memory?");
            if (!confirmed) return;

            try {
                await deleteDoc(doc(db, "couple_memories", memory.id));
            } catch (error) {
                console.error(error);
                alert("Failed to delete this memory.");
            }
        });

        content.appendChild(deleteButton);
        card.appendChild(content);

        card.addEventListener("click", () => {
            openViewer(index);
        });

        mediaContainer.appendChild(card);
    });
}

function uploadToCloudinary(file, onProgress) {
    return new Promise((resolve, reject) => {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`);

        xhr.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
                const percent = Math.round((event.loaded / event.total) * 100);
                onProgress(percent);
            }
        });

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    const response = JSON.parse(xhr.responseText);
                    resolve(response);
                } catch (error) {
                    reject(error);
                }
            } else {
                reject(new Error("Cloudinary upload failed."));
            }
        };

        xhr.onerror = () => {
            reject(new Error("Network error during upload."));
        };

        xhr.send(formData);
    });
}

uploadForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const title = document.getElementById("mediaTitle").value.trim();
    const type = document.getElementById("mediaType").value;
    const date = document.getElementById("mediaDate").value;
    const fileInput = document.getElementById("mediaFile");
    const file = fileInput.files[0];

    if (!file) {
        alert("Please select a file.");
        return;
    }

    try {
        uploadSubmitBtn.disabled = true;
        uploadSubmitBtn.textContent = "Uploading...";
        progressContainer.classList.remove("hidden");
        uploadProgress.style.width = "0%";
        progressText.textContent = "0%";

        const result = await uploadToCloudinary(file, (percent) => {
            uploadProgress.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
        });

        await addDoc(collection(db, "couple_memories"), {
            title: title,
            type: type,
            date: date,
            url: result.secure_url,
            public_id: result.public_id,
            createdAt: Date.now()
        });

        uploadForm.reset();
        uploadProgress.style.width = "100%";
        progressText.textContent = "100%";

        setTimeout(() => {
            progressContainer.classList.add("hidden");
            uploadModal.classList.add("hidden");
        }, 500);

    } catch (error) {
        console.error(error);
        alert("Upload failed. Please try again.");
    } finally {
        uploadSubmitBtn.disabled = false;
        uploadSubmitBtn.textContent = "Upload Memory";
    }
});

function openViewer(index) {
    if (index < 0 || index >= memories.length) return;
    currentViewIndex = index;
    renderViewer();
    viewModal.classList.remove("hidden");
}

function renderViewer() {
    const memory = memories[currentViewIndex];
    if (!memory) return;

    modalMediaContent.innerHTML = "";
    let media;

    if (memory.type === "video") {
        media = document.createElement("video");
        media.controls = true;
        media.autoplay = true;
        media.playsInline = true;
        media.className = "max-w-full max-h-[75vh] rounded-2xl shadow-2xl";
    } else {
        media = document.createElement("img");
        media.className = "max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl";
        media.alt = memory.title || "Memory";
    }

    media.src = memory.url;
    modalMediaContent.appendChild(media);
    modalTitle.textContent = memory.title || "Untitled Memory";
    modalDate.textContent = memory.date || "";
}

nextBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    if (memories.length === 0) return;
    currentViewIndex = (currentViewIndex + 1) % memories.length;
    renderViewer();
});

prevBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    if (memories.length === 0) return;
    currentViewIndex = (currentViewIndex - 1 + memories.length) % memories.length;
    renderViewer();
});

function closeMemoryViewer() {
    viewModal.classList.add("hidden");
    modalMediaContent.innerHTML = "";
}

closeViewModalBtn.addEventListener("click", closeMemoryViewer);

viewModal.addEventListener("click", (event) => {
    if (event.target === viewModal) {
        closeMemoryViewer();
    }
});

function showYoutubeStatus(message, type = "normal") {
    youtubeStatus.classList.remove("hidden");
    let className = "mt-5 rounded-xl p-4 text-sm ";

    if (type === "error") {
        className += "youtube-error text-red-300";
    } else {
        className += "bg-white/5 border border-white/5 text-slate-400";
    }

    youtubeStatus.className = className;
    youtubeStatus.innerHTML = message;
}

function hideYoutubeStatus() {
    youtubeStatus.classList.add("hidden");
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function extractYoutubeId(input) {
    const text = input.trim();
    if (!text) return null;

    if (/^[a-zA-Z0-9_-]{11}$/.test(text)) {
        return text;
    }

    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = text.match(regExp);

    return (match && match[2].length === 11) ? match[2] : null;
}

function processYoutubeInput() {
    const inputValue = youtubeSearchInput.value.trim();

    if (!inputValue) {
        showYoutubeStatus("Please paste a YouTube Link or Video ID.", "error");
        youtubeResults.innerHTML = "";
        return;
    }

    const videoId = extractYoutubeId(inputValue);

    if (!videoId) {
        showYoutubeStatus(`
            <div class="font-bold text-red-200 mb-1">Invalid YouTube Link</div>
            <div class="text-red-300/80">Please paste a valid YouTube video URL or ID.</div>
        `, "error");
        youtubeResults.innerHTML = "";
        return;
    }

    hideYoutubeStatus();
    renderYoutubeCard(videoId);
}

function renderYoutubeCard(videoId) {
    youtubeResults.innerHTML = "";

    const card = document.createElement("div");
    card.className = "w-full rounded-2xl overflow-hidden border border-white/10 bg-slate-900/80 shadow-2xl";
    card.innerHTML = `
        <div class="relative w-full aspect-video">
            <iframe 
                class="w-full h-full border-0" 
                src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&rel=0" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
        <div class="p-4 flex items-center justify-between bg-black/40">
            <div>
                <h3 class="text-white font-bold text-sm sm:text-base">YouTube Video</h3>
                <p class="text-xs text-rose-400 mt-0.5">ID: ${escapeHtml(videoId)}</p>
            </div>
            <button id="closeInPageVideoBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 border border-rose-500/20 transition">
                Close Player
            </button>
        </div>
    `;

    youtubeResults.appendChild(card);

    document.getElementById("closeInPageVideoBtn").addEventListener("click", () => {
        youtubeResults.innerHTML = "";
    });
}

youtubeSearchBtn.addEventListener("click", processYoutubeInput);

youtubeSearchInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        event.preventDefault();
        processYoutubeInput();
    }
});

document.addEventListener("keydown", (event) => {
    if (viewModal.classList.contains("hidden")) return;

    if (event.key === "Escape") {
        closeMemoryViewer();
    }
    if (event.key === "ArrowRight") {
        nextBtn.click();
    }
    if (event.key === "ArrowLeft") {
        prevBtn.click();
    }
});

try {
    await signOut(auth);
} catch (error) {
    console.error(error);
}
</script>
