<script type="module">

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    signInWithEmailAndPassword,
    onAuthStateChanged,

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    deleteDoc,

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



/* =========================================================
   CLOUDINARY CONFIG
========================================================= */

const CLOUDINARY_CLOUD_NAME = "vneswxx4";

const CLOUDINARY_UPLOAD_PRESET = "myeunji";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDZyW992JYkmfB9S9JskJNNyxX0wfjooBY",

    authDomain:
        "sweb-24fdc.firebaseapp.com",

    projectId:
        "sweb-24fdc",

        "883021695279",

};



/* =========================================================
   INITIALIZE
========================================================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =========================================================
   DOM
========================================================= */

const loginPage =

const mainApp =
    document.getElementById("mainApp");

const adminLoginForm =
    document.getElementById("adminLoginForm");

const logoutBtn =
    document.getElementById("logoutBtn");

const openUploadModalBtn =
    document.getElementById("openUploadModalBtn");

const uploadModal =
    document.getElementById("uploadModal");

const closeUploadModalBtn =
    document.getElementById("closeUploadModalBtn");

const uploadForm =
    document.getElementById("uploadForm");

const mediaContainer =
    document.getElementById("mediaContainer");

const viewModal =
    document.getElementById("viewModal");

const closeViewModalBtn =
    document.getElementById("closeViewModalBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const modalMediaContent =
    document.getElementById("modalMediaContent");

const modalTitle =
    document.getElementById("modalTitle");

const modalDate =
    document.getElementById("modalDate");

const progressContainer =
    document.getElementById("progressContainer");

const uploadProgress =
    document.getElementById("uploadProgress");

const progressText =
    document.getElementById("progressText");

const uploadSubmitBtn =
    document.getElementById("uploadSubmitBtn");



/* =========================================================
   STATE
========================================================= */

let memories = [];

let currentViewIndex = 0;



/* =========================================================
   AUTH PERSISTENCE
========================================================= */

await setPersistence(
    auth,
    inMemoryPersistence
);



/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    (user) => {

        if (user) {

            loginPage.classList.add(
                "hidden"
            );

            mainApp.classList.remove(
                "hidden"
            );

            loadMemories();

        } else {

            loginPage.classList.remove(
                "hidden"
            );

            mainApp.classList.add(
                "hidden"
            );

        }

    }
);



/* =========================================================
   LOGIN
========================================================= */

adminLoginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const button =
            adminLoginForm.querySelector(
                "button[type='submit']"
            );


        try {

            button.disabled = true;

            button.textContent =
                "Signing In...";


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        } catch (error) {

            console.error(error);

            alert(
                "Login failed. Please check your email and password."
            );


        } finally {

            button.disabled = false;

            button.textContent =
                "Sign In";

        }

    }
);



/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(auth);

        } catch (error) {

            console.error(error);

        }

    }
);



/* =========================================================
   LOAD MEMORIES
========================================================= */

function loadMemories() {

    const memoriesRef =
        collection(
            db,
            "couple_memories"
        );


    const q =
        query(memoriesRef);


    onSnapshot(
        q,
        (snapshot) => {

            memories =
                snapshot.docs.map(
                    (item) => ({
                        id: item.id,
                        ...item.data()
                    })
                );


            renderGallery();

        },
        (error) => {

            console.error(
                "Error loading memories:",
                error
            );

        }
    );

}



/* =========================================================
   RENDER GALLERY
========================================================= */

function renderGallery() {

    mediaContainer.innerHTML = "";


    if (memories.length === 0) {

        mediaContainer.innerHTML = `

            <div
                class="empty-state
                       col-span-full
                       rounded-3xl
                       p-12
                       text-center">

                <div class="text-5xl mb-4">
                    💗
                </div>

                <h3 class="text-xl font-bold text-white">
                    No Memories Yet
                </h3>

                <p class="text-slate-500 mt-2">
                    Upload your first memory to get started.
                </p>

            </div>

        `;

        return;
    }


    memories.forEach(
        (memory, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "memory-card group cursor-pointer";


            const mediaWrapper =
                document.createElement(
                    "div"
                );


            mediaWrapper.className =
                "relative aspect-[4/3] overflow-hidden bg-slate-900";


            let mediaElement;


            if (
                memory.type ===
                "video"
            ) {

                mediaElement =
                    document.createElement(
                        "video"
                    );


                mediaElement.controls =
                    false;

                mediaElement.muted =
                    true;

                mediaElement.playsInline =
                    true;


                mediaElement.className =
                    "memory-media w-full h-full object-cover";


                mediaElement.src =
                    memory.url;

            } else {

                mediaElement =
                    document.createElement(
                        "img"
                    );


                mediaElement.loading =
                    "lazy";


                mediaElement.className =
                    "memory-media w-full h-full object-cover";


                mediaElement.src =
                    memory.url;


                mediaElement.alt =
                    memory.title ||
                    "Memory";

            }


            mediaWrapper.appendChild(
                mediaElement
            );


            const overlay =
                document.createElement(
                    "div"
                );


            overlay.className =
                "absolute inset-0 bg-gradient-to-t from-black/65 via-transparent to-transparent opacity-70";


            mediaWrapper.appendChild(
                overlay
            );


            card.appendChild(
                mediaWrapper
            );


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "p-4";


            const title =
                document.createElement(
                    "h3"
                );


            title.className =
                "font-bold text-white truncate";


            title.textContent =
                memory.title ||
                "Untitled Memory";


            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "flex items-center justify-between gap-3 mt-2";


            const date =
                document.createElement(
                    "p"
                );


            date.className =
                "text-xs text-slate-500";


            date.textContent =
                memory.date ||
                "";


            const type =
                document.createElement(
                    "span"
                );


            type.className =
                "text-[10px] uppercase tracking-wider font-bold px-2 py-1 rounded-md bg-rose-500/10 text-rose-400 border border-rose-500/10";


            type.textContent =
                memory.type ||
                "image";


            meta.appendChild(
                date
            );


            meta.appendChild(
                type
            );


            content.appendChild(
                title
            );


            content.appendChild(
                meta
            );


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "mt-4 w-full py-2 rounded-xl text-sm font-semibold bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/10 transition";


            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                async (event) => {

                    event.stopPropagation();


                    const confirmed =
                        confirm(
                            "Are you sure you want to delete this memory?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    try {

                        await deleteDoc(
                            doc(
                                db,
                                "couple_memories",
                                memory.id
                            )
                        );


                    } catch (error) {

                        console.error(
                            error
                        );


                        alert(
                            "Failed to delete this memory."
                        );

                    }

                }
            );


            content.appendChild(
                deleteButton
            );


            card.appendChild(
                content
            );


            card.addEventListener(
                "click",
                () => {

                    openViewer(
                        index
                    );

                }
            );


            mediaContainer.appendChild(
                card
            );

        }
    );

}

/* =========================================================
   CLOUDINARY UPLOAD
========================================================= */

function uploadToCloudinary(
    file,
    onProgress
) {

    return new Promise(
        (resolve, reject) => {

            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            formData.append(
                "upload_preset",
                CLOUDINARY_UPLOAD_PRESET
            );


            const xhr =
                new XMLHttpRequest();


            xhr.open(
                "POST",
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`
            );


            xhr.upload.addEventListener(
                "progress",
                (event) => {

                    if (
                        event.lengthComputable
                    ) {

                        const percent =
                            Math.round(
                                (
                                    event.loaded /
                                    event.total
                                ) * 100
                            );


                        onProgress(
                            percent
                        );

                    }

                }
            );


            xhr.onload =
                () => {

                    if (
                        xhr.status >= 200 &&
                        xhr.status < 300
                    ) {

                        try {

                            const response =
                                JSON.parse(
                                    xhr.responseText
                                );


                            resolve(
                                response
                            );


                        } catch (error) {

                            reject(
                                error
                            );

                        }

                    } else {

                        reject(
                            new Error(
                                "Cloudinary upload failed."
                            )
                        );

                    }

                };


            xhr.onerror =
                () => {

                    reject(
                        new Error(
                            "Network error during upload."
                        )
                    );

                };


            xhr.send(
                formData
            );

        }
    );

}



/* =========================================================
   UPLOAD FORM
========================================================= */

uploadForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const title =
            document
                .getElementById("mediaTitle")
                .value
                .trim();


        const type =
            document
                .getElementById("mediaType")
                .value;


        /*
            DATE IS OPTIONAL.
            If the user does not select a date,
            this will simply be an empty string.
        */

        const date =
            document
                .getElementById("mediaDate")
                .value;


        const fileInput =
            document.getElementById(
                "mediaFile"
            );


        const file =
            fileInput.files[0];


        if (!file) {

            alert(
                "Please select a file."
            );

            return;
        }


        try {

            uploadSubmitBtn.disabled =
                true;


            uploadSubmitBtn.textContent =
                "Uploading...";


            progressContainer.classList.remove(
                "hidden"
            );


            uploadProgress.style.width =
                "0%";


            progressText.textContent =
                "0%";


            const result =
                await uploadToCloudinary(
                    file,
                    (percent) => {

                        uploadProgress.style.width =
                            `${percent}%`;


                        progressText.textContent =
                            `${percent}%`;

                    }
                );


            await addDoc(
                collection(
                    db,
                    "couple_memories"
                ),
                {
                    title: title,
                    type: type,

                    /*
                        Empty string if no date
                        was selected.
                    */

                    date: date,

                    url:
                        result.secure_url,

                    public_id:
                        result.public_id,

                    createdAt:
                        Date.now()
                }
            );


            uploadForm.reset();


            uploadProgress.style.width =
                "100%";


            progressText.textContent =
                "100%";


            setTimeout(
                () => {

                    progressContainer.classList.add(
                        "hidden"
                    );


                    uploadModal.classList.add(
                        "hidden"
                    );

                },
                500
            );


        } catch (error) {

            console.error(
                error
            );


            alert(
                "Upload failed. Please try again."
            );


        } finally {

            uploadSubmitBtn.disabled =
                false;


            uploadSubmitBtn.textContent =
                "Upload Memory";

        }

    }
);



/* =========================================================
   VIEWER
========================================================= */

function openViewer(index) {

    if (
        index < 0 ||
        index >= memories.length
    ) {
        return;
    }


    currentViewIndex =
        index;


    renderViewer();


    viewModal.classList.remove(
        "hidden"
    );

}



function renderViewer() {

    const memory =
        memories[
            currentViewIndex
        ];


    if (!memory) {
        return;
    }


    modalMediaContent.innerHTML =
        "";


    let media;


    if (
        memory.type ===
        "video"
    ) {

        media =
            document.createElement(
                "video"
            );


        media.controls =
            true;

        media.autoplay =
            true;

        media.playsInline =
            true;


        media.className =
            "max-w-full max-h-[75vh] rounded-2xl shadow-2xl";


    } else {

        media =
            document.createElement(
                "img"
            );


        media.className =
            "max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl";


        media.alt =
            memory.title ||
            "Memory";

    }


    media.src =
        memory.url;


    modalMediaContent.appendChild(
        media
    );


    modalTitle.textContent =
        memory.title ||
        "Untitled Memory";


    /*
        If date is empty,
        nothing will be shown.
    */

    modalDate.textContent =
        memory.date ||
        "";

}



/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();


        if (
            memories.length === 0
        ) {
            return;
        }


        currentViewIndex =
            (
                currentViewIndex + 1
            ) %
            memories.length;


        renderViewer();

    }
);



/* =========================================================
   PREVIOUS
========================================================= */

prevBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();


        if (
            memories.length === 0
        ) {
            return;
        }


        currentViewIndex =
            (
                currentViewIndex - 1 +
                memories.length
            ) %
            memories.length;


        renderViewer();

    }
);



/* =========================================================
   CLOSE VIEWER
========================================================= */

closeViewModalBtn.addEventListener(
    "click",
    () => {

        viewModal.classList.add(
            "hidden"
        );


        modalMediaContent.innerHTML =
            "";

    }
);


viewModal.addEventListener(
    "click",
    (event) => {

        if (
            event.target ===
            viewModal
        ) {

            viewModal.classList.add(
                "hidden"
            );


            modalMediaContent.innerHTML =
                "";

        }

    }
);



/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            viewModal.classList.contains(
                "hidden"
            )
        ) {
            return;
        }


        if (
            event.key ===
            "Escape"
        ) {

            viewModal.classList.add(
                "hidden"
            );


            modalMediaContent.innerHTML =
                "";

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextBtn.click();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            prevBtn.click();

        }

    }
);

try {

    );

} catch (error) {

    console.error(

    );

}
